<div id="pbs-slm-control">
<style>
#pbs-slm-control{color:var(--foreground)}
#pbs-slm-control svg{display:block;width:100%}
#pbs-slm-control svg text{fill:var(--foreground);font-size:var(--font-size-base);font-weight:400}
#pbs-slm-control svg .small{font-size:calc(var(--font-size-base)*.86)}
</style>
<h3>How light gets from the SLM to the microscope</h3>
<div class="viz-controls">
<label class="form-label" for="pbs-preset">Polarization preset<select class="form-select" id="pbs-preset"><option value="linear">Full output · linear</option><option value="circular">Full output · circular</option><option value="sim">SIM · binary phase</option><option value="blocked">SLM leaves polarization unchanged</option></select></label>
<button class="btn" type="button" id="pbs-pixel">Pixel A → switch to B</button>
</div>
<svg id="pbs-layout" role="img" aria-labelledby="pbs-title pbs-desc"></svg>
<div id="pbs-result" aria-live="polite"></div>
<div class="text-small">Ideal FLC model · power before diffraction and component losses</div>
<script>
(()=>{
const root=document.getElementById('pbs-slm-control'),svg=root.querySelector('svg'),preset=root.querySelector('#pbs-preset'),toggle=root.querySelector('#pbs-pixel');let pixel='A',edited=false;
const NS='http://www.w3.org/2000/svg',S='var(--viz-series-1)',P='var(--viz-series-2)',N='var(--foreground)',B='var(--border)';
function n(tag,a={},t=''){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);if(t)e.textContent=t;svg.appendChild(e);return e;}
function text(x,y,t,anchor='middle',small=false){return n('text',{x,y,'text-anchor':anchor,class:small?'small':''},t);}
function line(x1,y1,x2,y2,col=N,dash='',opacity=1){n('line',{x1,y1,x2,y2,stroke:col,'stroke-width':2,'stroke-dasharray':dash,opacity});}
function arrow(x1,y1,x2,y2,col,dash='',opacity=1){line(x1,y1,x2,y2,col,dash,opacity);const a=Math.atan2(y2-y1,x2-x1);for(const d of[-.5,.5])line(x2,y2,x2-7*Math.cos(a+d),y2-7*Math.sin(a+d),col,'',opacity);}
function glyph(x,y,kind){n('circle',{cx:x,cy:y,r:14,fill:'none',stroke:B});if(kind==='circular')n('circle',{cx:x,cy:y,r:9,fill:'none',stroke:N,'stroke-width':2});else if(kind==='s')line(x,y-10,x,y+10,S);else if(kind==='p')line(x-10,y,x+10,y,P);else if(kind==='mix')line(x-9,y+(pixel==='A'?9:-9),x+9,y+(pixel==='A'?-9:9),N);}
function draw(){const w=Math.max(280,Math.round(root.getBoundingClientRect().width)),mobile=w<560,x=w*.51,y=121,r=w-30,q=w*.22,mid=(x+r)/2;const mode=preset.value,sim=mode==='sim',blocked=mode==='blocked',out=blocked?0:sim?50:pixel==='A'?100:0,back=100-out,kind=sim?'mix':out?'p':'s';
svg.setAttribute('viewBox',`0 0 ${w} 350`);svg.setAttribute('height','350');svg.replaceChildren();
n('title',{id:'pbs-title'},'Laser shines up, PBS reflects light right to the SLM, returning p polarization passes left to the microscope');n('desc',{id:'pbs-desc'},'Solid paths travel toward the SLM; dashed paths return. The PBS reflects s and transmits p. Small circles show transverse polarization with local p horizontal and s vertical. Input HWP is fixed at 45 degrees. The output quarter-wave plate is at zero degrees for linear and 45 degrees for circular output.');
// Shared PBS and reflective SLM; arm paths slightly separated for readability.
n('rect',{x:x-19,y:y-19,width:38,height:38,fill:'var(--muted)',stroke:N});line(x-19,y+19,x+19,y-19,B);text(x-26,y+45,'PBS','end');
n('rect',{x:r-6,y:y-26,width:12,height:52,fill:'var(--muted)',stroke:N});text(r,y-40,'SLM');
// 1. Laser and HWP prepare s; PBS sends it right.
arrow(x,293,x,253,P);line(x-18,245,x+18,245);text(x-27,249,'HWP 45°','end',true);arrow(x,237,x,y+22,S);text(x,316,'Laser ↑');text(x-14,205,'s','end');
arrow(x+23,y-7,r-10,y-7,S);text(mid,y-34,mobile?'① s →':'① s reflected to SLM');
// 2. Return polarization determines routing at the same PBS.
arrow(r-10,y+7,x+23,y+7,kind==='p'?P:kind==='s'?S:N,'6 4');text(mid,y+39,mobile?(kind==='mix'?'② p + s':`② ${kind} ←`):(kind==='mix'?'② SLM returns p + s':`② SLM returns ${kind}`));
glyph(mid,y+72,kind);text(mid,y+101,blocked?'No rotation':sim?(mobile?'Axes ±22.5°':'FLC axes ±22.5°'):(mobile?'Axis '+(pixel==='A'?'45°':'0°'):'FLC axis '+(pixel==='A'?'45°':'0°')),'middle',true);
// 3. Transmitted return p reaches the output; show rejected power only if nonzero.
arrow(x-23,y,q+8,y,P,'6 4',out?1:.18);line(q,y-19,q,y+19);text(q,y-30,mode==='linear'||blocked?'QWP 0°':'QWP 45°','middle',true);arrow(q-8,y,15,y,N,'6 4',out?1:.18);
text(12,26,mobile?'← Fourier filter':'← Fourier filter / microscope','start');text(12,47,`③ Output: ${out}%`,'start');
if(out){glyph(q,y+52,mode==='linear'?'p':'circular');text(q,y+82,mode==='linear'?'Linear p':'Circular','middle',true);}else text(q,y+52,'No output','middle',true);
if(back){arrow(x+10,y+23,x+10,237,S,'6 4');arrow(x+10,253,x+10,293,N,'6 4');text(x+25,278,`${back}% back`,'start',true);}
text(12,344,mobile?'PBS: s reflects · p transmits':'PBS: s reflects · p transmits   |   Small circles: polarization viewed along the beam','start',true);
toggle.textContent=`Pixel ${pixel} → switch to ${pixel==='A'?'B':'A'}`;toggle.disabled=blocked;
root.querySelector('#pbs-result').textContent=blocked?'Unchanged s returns toward the laser.':sim?'Both pixels send 50% to the output, with opposite optical phase.':pixel==='A'?'Pixel A converts s → p: all ideal power exits toward the microscope.':'Pixel B keeps s: light returns toward the laser.';
root.dataset.outputPower=out;root.dataset.returnPower=back;
}
function save(){window.openai?.setWidgetState?.({modelContent:{preset:preset.value,pixel},privateContent:null}).catch(()=>{});}
function restore(s){const v=s?.modelContent;if(v){if(['linear','circular','sim','blocked'].includes(v.preset))preset.value=v.preset;else if(v.slmModel)preset.value=v.slmModel==='phase'?'sim':v.slmModel==='unchanged'?'blocked':v.qwpAngle===0?'linear':'circular';if(['A','B'].includes(v.pixel))pixel=v.pixel;}draw();}
preset.addEventListener('change',()=>{edited=true;pixel='A';draw();save();});toggle.addEventListener('click',()=>{edited=true;pixel=pixel==='A'?'B':'A';draw();save();});window.addEventListener('openai:set_globals',e=>{if(!edited)restore(e.detail?.globals?.widgetState);});restore(window.openai?.widgetState);new ResizeObserver(draw).observe(root);
})();
</script>
</div>
